<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f7f8f5" />
    <meta
      name="description"
      content="Un po’ di italiano, una frase alla volta. Esercitati con le coniugazioni, al tuo ritmo."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="cd07c993-e115-4c20-95eb-6ef030e1b0a7"
      data-domains="un-po.github.io"
    ></script>
    <title>Un po’ — una frase alla volta</title>
    <script>
      try {
        const saved = localStorage.getItem('unpo-theme');
        document.documentElement.dataset.theme =
          saved === 'dark' || saved === 'light'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
      } catch {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light';
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
